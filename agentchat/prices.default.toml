# Agent Chat token prices, in USD per million tokens.
#
# The copy under the data directory, beside agentchat.db, is the table in force.
# It is seeded from the packaged default on first run and never overwritten after
# that, so edit that copy and restart the server to apply new rates.
#
# Every model a user can select should be listed. An unlisted model is billed at
# [fallback] and marked "fallback" in the ledger, so a quota still holds and the
# admin console shows which model needs a rate. Only an exact id or a dated
# snapshot of one (claude-opus-5-5-20260901, gpt-4.1-2025-04-14) counts as
# listed; a new sibling such as a future gpt-5.7 falls to [fallback] rather than
# quietly inheriting a cheaper relative's rate.
#
# Rates below are Anthropic's and OpenAI's published standard-tier, short-context
# rates as of 2026-09-27. Four things this table cannot express, each of which
# under-bills where it applies:
#   - Long context. GPT-6 and GPT-5.6 charge 2x input and 1.5x output above a
#     context threshold OpenAI does not publish for those models.
#   - Fast mode / priority processing is about 2x standard.
#   - FedRAMP and data-residency endpoints add 10%.
#   - Batch and Flex are about half standard, so those over-bill instead.
#
# Where a provider publishes no cached-input or cache-write rate, the value here
# is the model's full input rate: a cached or cache-written token is then billed
# as ordinary input rather than as free. Those rows are marked "# no published
# cache rate".
#
# Deliberately absent: "-latest" aliases. OpenAI repoints them to newer models,
# which would silently change what a user is charged.

[fallback]
input = 5.0
cached_input = 0.5
cache_write = 6.25
output = 25.0

